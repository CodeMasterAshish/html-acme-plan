<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <a href="index.html">Home</a>
</head>
<body>

    <h1>Contact Us</h1>
    <p>Please fill out the form below to get in touch with our team.</p>



    <form action="#" method="POST">
        <fieldset>
            <legend>Your Contact Information</legend>
            
            <p>
                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </p>
            
            <p>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </p>
            
            <p>
                <label for="subject">Subject:</label><br>
                <input type="text" id="subject" name="subject" placeholder="What is this regarding?">
            </p>
            
            <p>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="6" cols="40" placeholder="Type your message here..." required></textarea>
            </p>
            
            <p>
                <input type="submit" value="Send Message">
                <input type="reset" value="Clear Form">
            </p>
        </fieldset>
    </form>

</body>
</html>
